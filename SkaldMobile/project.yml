# Skald for iOS — generated into Skald.xcodeproj by `xcodegen generate`.
# The .xcodeproj is NOT committed; regenerate it after editing this file.
name: Skald
options:
  bundleIdPrefix: com.ivshestakov
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 975ZZPJQNB
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Skald:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ivshestakov.skald.ios
        PRODUCT_NAME: Skald
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Skald iOS App Store"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Skald
        CFBundleName: Skald
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/Skald.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ivshestakov.skald
    dependencies:
      - target: SkaldKeyboard
        embed: true

  SkaldKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
        excludes: ["Resources/**"]
      - path: Shared
      - path: Keyboard/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ivshestakov.skald.ios.keyboard
        PRODUCT_NAME: SkaldKeyboard
        SKIP_INSTALL: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Skald Keyboard iOS App Store"
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Skald
        CFBundleName: SkaldKeyboard
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: mul
            RequestsOpenAccess: true
    entitlements:
      path: Keyboard/SkaldKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ivshestakov.skald

schemes:
  Skald:
    build:
      targets:
        Skald: all
        SkaldKeyboard: all
    run:
      config: Debug
      executable: Skald
